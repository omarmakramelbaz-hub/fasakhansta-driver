name: Delegate GitHub Web View

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Flutter Web platform
        run: flutter create . --platforms web --no-pub

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/fasakhansta-driver/"

      - name: Force fresh preview assets
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          build = os.environ.get('GITHUB_SHA', 'dev')[:12]
          root = Path('build/web')
          index = root / 'index.html'
          bootstrap = root / 'flutter_bootstrap.js'
          main_js = root / 'main.dart.js'

          # Give the Go Drive logo a new URL on every build so Safari/GitHub Pages
          # cannot reuse the old fisherman logo from cache.
          old_logo_key = 'assets/images/delegate_login_fisher_logo.jpg'
          logo_dir = root / 'assets' / 'assets' / 'images'
          old_logo_file = logo_dir / 'delegate_login_fisher_logo.jpg'
          new_logo_name = f'delegate_go_drive_{build}.jpg'
          new_logo_key = f'assets/images/{new_logo_name}'
          new_logo_file = logo_dir / new_logo_name

          if old_logo_file.exists():
              new_logo_file.write_bytes(old_logo_file.read_bytes())

          if main_js.exists():
              js = main_js.read_text(encoding='utf-8')
              js = js.replace(old_logo_key, new_logo_key)
              main_js.write_text(js, encoding='utf-8')

          if main_js.exists() and bootstrap.exists():
              versioned_name = f'main.dart.{build}.js'
              (root / versioned_name).write_bytes(main_js.read_bytes())
              bootstrap_text = bootstrap.read_text(encoding='utf-8')
              bootstrap_text = bootstrap_text.replace('main.dart.js', versioned_name)
              bootstrap.write_text(bootstrap_text, encoding='utf-8')

          html = index.read_text(encoding='utf-8')
          original = '<script src="flutter_bootstrap.js" async></script>'
          loader = f'''<script>
          (async function () {{
            try {{
              if ('serviceWorker' in navigator) {{
                const regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map((r) => r.unregister()));
              }}
              if ('caches' in window) {{
                const keys = await caches.keys();
                await Promise.all(keys.map((k) => caches.delete(k)));
              }}
            }} catch (_) {{}}
            const script = document.createElement('script');
            script.src = 'flutter_bootstrap.js?build={build}';
            script.async = true;
            document.body.appendChild(script);
          }})();
          </script>'''
          if original in html:
              html = html.replace(original, loader)
          else:
              html = html.replace('</body>', loader + '\n</body>')
          index.write_text(html, encoding='utf-8')
          PY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

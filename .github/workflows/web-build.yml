name: Delegate GitHub Web View

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Flutter Web platform
        run: flutter create . --platforms web --no-pub

      - name: Configure Google Maps for Web
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('web/index.html')
          html = index.read_text(encoding='utf-8')
          maps_script = '<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBDfirv6d7BiO-9YnsU5zCHEn9iM9iNtuM&libraries=places&language=ar&region=EG&v=weekly"></script>'
          if 'maps.googleapis.com/maps/api/js' not in html:
              html = html.replace('</head>', f'  {maps_script}\n</head>')
              index.write_text(html, encoding='utf-8')
          PY

      - name: Keep web preview inside delegate UI on 401
        run: |
          python3 - <<'PY'
          from pathlib import Path

          api = Path('lib/helpers/networking/api_helper.dart')
          text = api.read_text(encoding='utf-8')
          old = '''      case 401:\n        var responseJson = response.data;\n        Future.delayed(Duration.zero, () {\n          AppRouters.navigatorKey.currentState?.pushNamedAndRemoveUntil(LoginScreen.routeName, (route) => false);\n        });\n        return ApiResponse(state: ResponseState.unauthorized, data: responseJson);'''
          new = '''      case 401:\n        var responseJson = response.data;\n        // GitHub Pages is a UI preview and intentionally bypasses real login.\n        // API calls can therefore return 401; do not treat that as logout on web.\n        if (!kIsWeb) {\n          Future.delayed(Duration.zero, () {\n            AppRouters.navigatorKey.currentState?.pushNamedAndRemoveUntil(LoginScreen.routeName, (route) => false);\n          });\n        }\n        return ApiResponse(state: ResponseState.unauthorized, data: responseJson);'''
          if old not in text:
              raise SystemExit('401 redirect block not found')
          api.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/fasakhansta-driver/"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

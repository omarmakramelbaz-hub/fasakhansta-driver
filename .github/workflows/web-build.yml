name: Delegate GitHub Web View

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Flutter Web platform
        run: flutter create . --platforms web --no-pub

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/fasakhansta-driver/"

      - name: Force fresh preview and single branded opening
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          build = os.environ.get('GITHUB_SHA', 'dev')[:12]
          root = Path('build/web')
          index = root / 'index.html'
          bootstrap = root / 'flutter_bootstrap.js'
          main_js = root / 'main.dart.js'

          # Version the compiled app bundle so Safari always loads the current build.
          if main_js.exists() and bootstrap.exists():
              versioned_name = f'main.dart.{build}.js'
              (root / versioned_name).write_bytes(main_js.read_bytes())
              bootstrap_text = bootstrap.read_text(encoding='utf-8')
              bootstrap_text = bootstrap_text.replace('main.dart.js', versioned_name)
              bootstrap.write_text(bootstrap_text, encoding='utf-8')

          html = index.read_text(encoding='utf-8')
          original = '<script src="flutter_bootstrap.js" async></script>'

          # Show the same Go Drive logo immediately, before Flutter paints its first frame,
          # so the web preview no longer flashes through two blank white screens.
          opening = f'''
          <style>
            html, body {{ margin: 0; width: 100%; height: 100%; background: #fff; }}
            #go-drive-opening {{
              position: fixed; inset: 0; z-index: 2147483647; background: #fff;
              display: flex; align-items: center; justify-content: center;
            }}
            #go-drive-opening img {{ width: min(72vw, 360px); height: auto; object-fit: contain; }}
          </style>
          <div id="go-drive-opening">
            <img src="assets/assets/images/delegate_login_fisher_logo.jpg?build={build}" alt="Go Drive">
          </div>
          <script>
          (async function () {{
            const logoUrl = 'assets/assets/images/delegate_login_fisher_logo.jpg?build={build}';
            try {{
              if ('serviceWorker' in navigator) {{
                const regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map((r) => r.unregister()));
              }}
              if ('caches' in window) {{
                const keys = await caches.keys();
                await Promise.all(keys.map((k) => caches.delete(k)));
              }}
              // Force Safari to refresh the actual asset URL used by Flutter login/register/splash.
              await fetch('assets/assets/images/delegate_login_fisher_logo.jpg', {{cache: 'reload'}});
            }} catch (_) {{}}

            const script = document.createElement('script');
            script.src = 'flutter_bootstrap.js?build={build}';
            script.async = true;
            document.body.appendChild(script);

            // Remove only after Flutter has had time to paint the branded splash beneath it.
            const removeOpening = () => {{
              const el = document.getElementById('go-drive-opening');
              if (el) el.remove();
            }};
            window.addEventListener('flutter-first-frame', removeOpening, {{once: true}});
            setTimeout(removeOpening, 3500);
          }})();
          </script>
          '''

          if original in html:
              html = html.replace(original, opening)
          else:
              html = html.replace('</body>', opening + '\n</body>')
          index.write_text(html, encoding='utf-8')
          PY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

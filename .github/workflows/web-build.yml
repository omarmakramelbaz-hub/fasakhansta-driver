name: Delegate GitHub Web View

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix dashboard viewport spacing in source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/view/layout/home/screen/home_delegate_screen.dart')
          lines = path.read_text(encoding='utf-8').splitlines()

          # Make the design canvas follow the real viewport height on every width.
          for i, line in enumerate(lines):
              if line.strip() == 'height: 690,':
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = indent + 'height: c.maxHeight * 390 / (c.maxWidth < 390 ? c.maxWidth : 390),'
                  break

          # Find the dashboard content block by its real widgets instead of brittle indentation matching.
          section_idx = next(i for i, line in enumerate(lines) if '_sectionTitle(' in line)
          start = next(i for i in range(section_idx, -1, -1) if lines[i].strip() == 'Padding(')
          quick_idx = next(i for i in range(section_idx, len(lines)) if lines[i].strip() == '_quickActions(),')
          end = quick_idx
          while end + 1 < len(lines):
              end += 1
              if lines[end].strip() == '),' and lines[end - 1].strip() == '),':
                  break

          replacement = [
              '                            Expanded(',
              '                              child: Padding(',
              '                                padding: const EdgeInsets.fromLTRB(12, 0, 12, 8),',
              '                                child: Column(',
              '                                  children: [',
              '                                    _sectionTitle(',
              '                                      _t(\'طلبات اليوم\', "Today\'s orders"),',
              '                                      _t(\'عرض الكل\', \'View all\'),',
              '                                      () => context.read<DelegateBottomNavBarController>().updateIndex(1),',
              '                                    ),',
              '                                    const SizedBox(height: 6),',
              '                                    _stats(controller),',
              '                                    const Spacer(),',
              '                                    _currentOrder(currentOrder),',
              '                                    const Spacer(),',
              '                                    const MyCurrentBalanceWidget(),',
              '                                    const Spacer(),',
              '                                    _quickActions(),',
              '                                  ],',
              '                                ),',
              '                              ),',
              '                            ),',
          ]

          lines[start:end + 1] = replacement
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          if ! git diff --quiet -- lib/view/layout/home/screen/home_delegate_screen.dart; then
            git config user.name "omarmakramelbaz-hub"
            git config user.email "omarmakramelbaz@gmail.com"
            git add lib/view/layout/home/screen/home_delegate_screen.dart
            git commit -m "Fix dashboard viewport spacing [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Flutter Web platform
        run: flutter create . --platforms web --no-pub

      - name: Verify permanent HD Go Drive logo
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/images/go_drive_logo_hd.webp
          file assets/images/go_drive_logo_hd.webp | grep -qi 'webp'
          test "$(stat -c%s assets/images/go_drive_logo_hd.webp)" -eq 67002
          grep -q 'assets/images/go_drive_logo_hd.webp' lib/view/layout/auth/screen/login_screen.dart
          grep -q 'assets/images/go_drive_logo_hd.webp' lib/view/layout/auth/screen/regester_screen.dart
          grep -q 'fit: BoxFit.contain' lib/view/layout/auth/screen/login_screen.dart
          grep -q 'fit: BoxFit.contain' lib/view/layout/auth/screen/regester_screen.dart

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/fasakhansta-driver/"

      - name: Verify built HD logo and force fresh preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          build = os.environ.get('GITHUB_SHA', 'dev')[:12]
          root = Path('build/web')
          index = root / 'index.html'
          bootstrap = root / 'flutter_bootstrap.js'
          main_js = root / 'main.dart.js'
          logo = root / 'assets' / 'assets' / 'images' / 'go_drive_logo_hd.webp'

          if not logo.exists() or logo.stat().st_size != 67002:
              raise SystemExit('Permanent HD Go Drive logo missing or invalid in web build')

          if main_js.exists() and bootstrap.exists():
              versioned_name = f'main.dart.{build}.js'
              (root / versioned_name).write_bytes(main_js.read_bytes())
              text = bootstrap.read_text(encoding='utf-8').replace('main.dart.js', versioned_name)
              bootstrap.write_text(text, encoding='utf-8')

          html = index.read_text(encoding='utf-8')
          original = '<script src="flutter_bootstrap.js" async></script>'
          opening = f'''
          <style>
            html, body {{ margin: 0; width: 100%; height: 100%; background: #fff; }}
            #go-drive-opening {{ position: fixed; inset: 0; z-index: 2147483647; background: #fff; display: flex; align-items: center; justify-content: center; }}
            #go-drive-opening img {{ width: min(72vw, 360px); max-height: 48vh; object-fit: contain; display: block; }}
          </style>
          <div id="go-drive-opening"><img src="assets/assets/images/go_drive_logo_hd.webp?build={build}" alt="Go Drive"></div>
          <script>
          (async function () {{
            try {{
              if ('serviceWorker' in navigator) {{
                const regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map((r) => r.unregister()));
              }}
              if ('caches' in window) {{
                const keys = await caches.keys();
                await Promise.all(keys.map((k) => caches.delete(k)));
              }}
            }} catch (_) {{}}
            const script = document.createElement('script');
            script.src = 'flutter_bootstrap.js?build={build}';
            script.async = true;
            document.body.appendChild(script);
            const removeOpening = () => {{ const el = document.getElementById('go-drive-opening'); if (el) el.remove(); }};
            window.addEventListener('flutter-first-frame', removeOpening, {{once: true}});
            setTimeout(removeOpening, 3000);
          }})();
          </script>
          '''
          html = html.replace(original, opening) if original in html else html.replace('</body>', opening + '\n</body>')
          index.write_text(html, encoding='utf-8')
          PY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

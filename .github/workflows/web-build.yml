name: Delegate GitHub Web View

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Flutter Web platform
        run: flutter create . --platforms web --no-pub

      - name: Configure Google Maps for Web
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('web/index.html')
          html = index.read_text(encoding='utf-8')
          maps_script = '<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBDfirv6d7BiO-9YnsU5zCHEn9iM9iNtuM&libraries=places&language=ar&region=EG&v=weekly"></script>'
          if 'maps.googleapis.com/maps/api/js' not in html:
              html = html.replace('</head>', f'  {maps_script}\n</head>')
              index.write_text(html, encoding='utf-8')
          PY

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/fasakhansta-driver/"

      - name: Force fresh preview assets
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          build = os.environ.get('GITHUB_SHA', 'dev')[:12]
          root = Path('build/web')
          index = root / 'index.html'
          bootstrap = root / 'flutter_bootstrap.js'
          main_js = root / 'main.dart.js'

          if main_js.exists() and bootstrap.exists():
              versioned_name = f'main.dart.{build}.js'
              (root / versioned_name).write_bytes(main_js.read_bytes())
              bootstrap_text = bootstrap.read_text(encoding='utf-8')
              bootstrap_text = bootstrap_text.replace('main.dart.js', versioned_name)
              bootstrap.write_text(bootstrap_text, encoding='utf-8')

          html = index.read_text(encoding='utf-8')
          original = '<script src="flutter_bootstrap.js" async></script>'
          loader = f'''<script>
          (async function () {{
            try {{
              if ('serviceWorker' in navigator) {{
                const regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map((r) => r.unregister()));
              }}
              if ('caches' in window) {{
                const keys = await caches.keys();
                await Promise.all(keys.map((k) => caches.delete(k)));
              }}
            }} catch (_) {{}}
            const script = document.createElement('script');
            script.src = 'flutter_bootstrap.js?build={build}';
            script.async = true;
            document.body.appendChild(script);
          }})();
          </script>'''
          if original in html:
              html = html.replace(original, loader)
          else:
              html = html.replace('</body>', loader + '\n</body>')
          index.write_text(html, encoding='utf-8')
          PY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

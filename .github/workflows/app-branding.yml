name: Apply Go Drive Splash And App Icon

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/app-branding.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Prepare branding configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          src = Path('assets/images/go_drive_logo_hd.webp')
          if not src.exists():
              raise SystemExit('Go Drive HD logo is missing')
          logo = Image.open(src).convert('RGB')

          def make_square(path: str, inner_size: int):
              canvas = Image.new('RGB', (1024, 1024), 'white')
              work = logo.copy()
              work.thumbnail((inner_size, inner_size), Image.Resampling.LANCZOS)
              x = (1024 - work.width) // 2
              y = (1024 - work.height) // 2
              canvas.paste(work, (x, y))
              canvas.save(path, format='PNG', optimize=True)

          make_square('assets/images/go_drive_splash_native.png', 760)
          make_square('assets/images/go_drive_app_icon.png', 820)

          splash_path = Path('lib/view/layout/screen/splash_screen.dart')
          text = splash_path.read_text(encoding='utf-8')
          text = text.replace("'assets/images/delegate_login_fisher_logo.jpg'", "'assets/images/go_drive_logo_hd.webp'")
          if 'final DateTime _openingStartedAt = DateTime.now();' not in text:
              text = text.replace(
                  "  bool _navigated = false;\n",
                  "  bool _navigated = false;\n  final DateTime _openingStartedAt = DateTime.now();\n",
                  1,
              )
          text = text.replace(
              "  void _goLogin() {\n    if (!mounted || _navigated) return;",
              "  Future<void> _goLogin() async {\n    await _waitForOpening();\n    if (!mounted || _navigated) return;",
          )
          text = text.replace(
              "  void _goHome() {\n    if (!mounted || _navigated) return;",
              "  Future<void> _goHome() async {\n    await _waitForOpening();\n    if (!mounted || _navigated) return;",
          )
          if 'Future<void> _waitForOpening()' not in text:
              anchor = "  void _initial() {\n"
              waiter = "  Future<void> _waitForOpening() async {\n    final elapsed = DateTime.now().difference(_openingStartedAt).inMilliseconds;\n    final remainingMs = 3000 - elapsed;\n    if (remainingMs > 0) {\n      await Future.delayed(Duration(milliseconds: remainingMs));\n    }\n  }\n\n"
              if anchor not in text:
                  raise SystemExit('Could not locate splash initialization')
              text = text.replace(anchor, waiter + anchor, 1)
          text = text.replace("      Future.delayed(const Duration(milliseconds: 800), _goLogin);", "      _goLogin();")
          text = text.replace("              Future.delayed(const Duration(milliseconds: 500), _goHome);", "              _goHome();")
          text = text.replace("              Future.delayed(const Duration(milliseconds: 250), _goLogin);", "              _goLogin();")
          splash_path.write_text(text, encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          p = pubspec.read_text(encoding='utf-8')
          # Keep generators out of project dependencies; this avoids touching the app dependency lockfile.
          p = re.sub(r'^\s*flutter_native_splash:\s*\^.*\n', '', p, flags=re.M)
          p = re.sub(r'^\s*flutter_launcher_icons:\s*\^.*\n', '', p, flags=re.M)
          branding = '''\nflutter_native_splash:\n  color: "#FFFFFF"\n  image: assets/images/go_drive_splash_native.png\n  android: true\n  ios: true\n  web: false\n  android_12:\n    color: "#FFFFFF"\n    image: assets/images/go_drive_splash_native.png\n    icon_background_color: "#FFFFFF"\n\nflutter_launcher_icons:\n  android: true\n  ios: true\n  image_path: assets/images/go_drive_app_icon.png\n  min_sdk_android: 21\n  remove_alpha_ios: true\n  web:\n    generate: true\n    image_path: assets/images/go_drive_app_icon.png\n    background_color: "#FFFFFF"\n    theme_color: "#FD7201"\n'''
          p = re.sub(r'\nflutter_native_splash:\n[\s\S]*\Z', '\n' + branding.lstrip('\n'), p)
          pubspec.write_text(p, encoding='utf-8')
          PY

          dart format lib/view/layout/screen/splash_screen.dart

      - name: Install branding generators
        shell: bash
        run: |
          set -euo pipefail
          dart pub global activate flutter_native_splash 2.4.6
          dart pub global activate flutter_launcher_icons 0.14.4

      - name: Generate native splash
        run: dart pub global run flutter_native_splash:create

      - name: Generate app icons
        run: dart pub global run flutter_launcher_icons

      - name: Verify Go Drive branding
        shell: bash
        run: |
          set -euo pipefail
          grep -q "go_drive_logo_hd.webp" lib/view/layout/screen/splash_screen.dart
          grep -q "remainingMs = 3000" lib/view/layout/screen/splash_screen.dart
          test -s assets/images/go_drive_splash_native.png
          test -s assets/images/go_drive_app_icon.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          test -s web/icons/Icon-512.png

      - name: Commit generated branding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml \
            lib/view/layout/screen/splash_screen.dart \
            assets/images/go_drive_splash_native.png \
            assets/images/go_drive_app_icon.png \
            android ios web
          if git diff --cached --quiet; then
            echo "Branding already applied"
            exit 0
          fi
          git commit -m "Use Go Drive for 3-second splash and app icon"
          git push

name: Install HD Go Drive Logo

on:
  push:
    branches: [ "main" ]
    paths:
      - 'tool/go_drive_logo_hd_chunks/**'
      - '.github/workflows/install-go-drive-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Rebuild HD Go Drive logo
        shell: bash
        run: |
          set -euo pipefail
          cat tool/go_drive_logo_hd_chunks/*.b64 > /tmp/go_drive_logo.b64
          base64 -d /tmp/go_drive_logo.b64 > assets/images/go_drive_logo_hd.webp
          test -s assets/images/go_drive_logo_hd.webp
          file assets/images/go_drive_logo_hd.webp | grep -qi 'webp'
          test "$(stat -c%s assets/images/go_drive_logo_hd.webp)" -eq 67002
          echo "25a4c745b357a4d90df07482218e41122ab71631f7a6473002d25a0149d49de  assets/images/go_drive_logo_hd.webp" | sha256sum -c -

      - name: Commit HD logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/go_drive_logo_hd.webp
          if git diff --cached --quiet; then
            echo "Logo already present"
            exit 0
          fi
          git commit -m "Add HD Go Drive logo asset"
          git push

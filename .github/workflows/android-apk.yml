name: Build Go Drive Driver APK

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Go Drive app icon
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/images/go_drive_app_icon.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-drive-driver-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

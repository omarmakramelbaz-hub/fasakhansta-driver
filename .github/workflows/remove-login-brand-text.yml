name: Remove repeated login brand text

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/remove-login-brand-text.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove repeated Go Drive title
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/view/layout/auth/screen/login_screen.dart')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"\n\s*SizedBox\(height: veryCompact \? 2 : \(compact \? 5 : 7\)\),"
              r"\n\s*Text\(\n\s*'Go Drive',.*?\n\s*\),"
              r"\n\s*SizedBox\(height: veryCompact \? 4 : 7\),",
              re.S,
          )
          updated, count = pattern.subn("\n                            SizedBox(height: veryCompact ? 4 : (compact ? 7 : 10)),", text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Go Drive title block, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/view/layout/auth/screen/login_screen.dart
          git commit -m "Remove repeated Go Drive text from login" 
          git push
